---
job: LibVMA-redmine-issue

registry_host: harbor.mellanox.com
registry_auth: swx-storage

kubernetes:
  privileged: true
  cloud: il-ipp-blossom-prod
  namespace: swx-media
  nodeSelector: 'beta.kubernetes.io/os=linux'
  limits: '{memory: 1Gi, cpu: 1000m}'
  requests: '{memory: 1Gi, cpu: 1000m}'
  arch_table:
    x86_64:
      nodeSelector: 'kubernetes.io/arch=amd64'
      jnlpImage: 'harbor.mellanox.com/toolbox/c3po-jnlp:latest'

failFast: false
timeout_minutes: 20
env:
  MAIL_FROM: jenkins@nvidia.com

volumes:
  - {mountPath: /hpc/local/inst/hpc-internal-tools, hostPath: /hpc/local/inst/hpc-internal-tools}

# TODO: placeholder. Store the NVBugs API token in Jenkins, set its
# credential ID here and in the Redmine step, then uncomment both.
# Until then, commits with an NVBug reference fail the check.
#credentials:
#  - {credentialsId: 'PLACEHOLDER-nvbugs-api-token', type: 'string', variable: 'NVBUGS_TOKEN'}

runs_on_dockers:
  - {name: 'ub22.04-base', url: 'harbor.mellanox.com/hpcx/x86_64/ubuntu22.04/base', arch: 'x86_64'}

steps:
  - name: Redmine
    containerSelector:
      - "{name: 'ub22.04-base'}"
    # TODO: placeholder, see the credentials block above.
    #credentialsId: 'PLACEHOLDER-nvbugs-api-token'
    run: |
      #!/bin/bash -eExl
      python3 -m pip install six
      python3 .ci/check_issue.py --commit-id "${ghprbActualCommit}" --pr-url "${ghprbPullLink}"
    parallel: false

pipeline_start:
  run: |
    printenv
    echo "Start"

pipeline_stop:
  shell: action
  module: groovy
  run: |
    mail from: "${MAIL_FROM}",
      mimeType: 'text/html',
      to: "${MAIL_TO}",
      subject: 'Redmine check for build ${currentBuild.number}',
      body: """
        <p><b>Build url:</b> <a href=${currentBuild.absoluteUrl}>link</a></p>"""
    sh 'echo "Finish"'
